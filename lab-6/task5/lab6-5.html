<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №6. Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">
    <div class="weather">
        <ul class="forecast">
            <li class="forecast-day"><span class="forecast-name">Mon</span><span class="forecast-temp">17°</span></li>
            <li class="forecast-day"><span class="forecast-name">Tue</span><span class="forecast-temp">19°</span></li>
            <li class="forecast-day"><span class="forecast-name">Wed</span><span class="forecast-temp">16°</span></li>
            <li class="forecast-day"><span class="forecast-name">Thu</span><span class="forecast-temp">18°</span></li>
            <li class="forecast-day"><span class="forecast-name">Fri</span><span class="forecast-temp">21°</span></li>
        </ul>

        <div class="card">
            <span class="card-temp">17</span>
        </div>

        <div class="cloud">
            <span class="cloud-part cloud-part--base"></span>
            <span class="cloud-part cloud-part--left"></span>
            <span class="cloud-part cloud-part--middle"></span>
            <span class="cloud-part cloud-part--top"></span>
            <span class="cloud-part cloud-part--right"></span>
        </div>

        <div class="arrows">
            <a class="arrow arrow--prev" href="#">&larr;</a>
            <a class="arrow arrow--next" href="#">&rarr;</a>
        </div>
    </div>
</body>
</html>
