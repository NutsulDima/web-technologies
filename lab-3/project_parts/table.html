<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 1. Таблиця</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
    .frame { display: inline-block; background: #fff; padding: 6px; border: 1px solid #ccc; }
    table { border-collapse: collapse; table-layout: fixed; width: 496px; }
    td { border: 2px solid #000; width: 62px; height: 62px; padding: 0; }
    .aqua { background: #33ffd6; }
    .cream { background: #fffcd6; }
    .red { background: #ff1020; }
    .blue { background: #1030ff; }
    .green { background: #28ff28; }
    .yellow { background: #ffff33; }
  </style>
</head>
<body>
  <p><a href="../index.html">Повернутись на головну</a></p>
  <div class="frame">
    <table>
      <tr>
        <td colspan="8" class="aqua"></td>
      </tr>
      <tr>
        <td rowspan="6" class="cream"></td>
        <td colspan="6" class="aqua"></td>
        <td rowspan="6" class="cream"></td>
      </tr>
      <tr>
        <td rowspan="4" class="cream"></td>
        <td colspan="4" class="aqua"></td>
        <td rowspan="4" class="cream"></td>
      </tr>
      <tr>
        <td rowspan="2" class="cream"></td>
        <td class="red"></td>
        <td class="blue"></td>
        <td rowspan="2" class="cream"></td>
      </tr>
      <tr>
        <td class="green"></td>
        <td class="yellow"></td>
      </tr>
      <tr>
        <td colspan="4" class="aqua"></td>
      </tr>
      <tr>
        <td colspan="6" class="aqua"></td>
      </tr>
      <tr>
        <td colspan="8" class="aqua"></td>
      </tr>
    </table>
  </div>
</body>
</html>
