  <!doctype html>
  <html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 2. Мондріан</title>
    <style>
      body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
      table { margin: 0 auto; border-collapse: collapse; table-layout: fixed; width: 625px; }
      td { border: 10px solid #000; padding: 0; }
      .white { background: #ffffff; }
      .red { background: #ff5b2d; }
      .blue { background: #074481; }
      .yellow { background: #fffa69; }
      .black { background: #000000; }
    </style>
  </head>
  <body>
    <p><a href="../index.html">Повернутись на головну</a></p>
    <h2>Піт Мондріан. «Композиція з червоним, синім і жовтим»</h2>
    <table>
      <colgroup>
        <col style="width: 66px">
        <col style="width: 85px">
        <col style="width: 91px">
        <col style="width: 171px">
        <col style="width: 112px">
        <col style="width: 100px">
      </colgroup>
      <tr style="height: 64px">
        <td colspan="2" class="white"></td>
        <td colspan="2" class="white"></td>
        <td colspan="2" class="yellow"></td>
      </tr>
      <tr style="height: 173px">
        <td class="white"></td>
        <td colspan="3" rowspan="2" class="red"></td>
        <td colspan="2" class="yellow"></td>
      </tr>
      <tr style="height: 174px">
        <td rowspan="2" class="white"></td>
        <td class="white"></td>
        <td class="white"></td>
      </tr>
      <tr style="height: 90px">
        <td colspan="2" rowspan="2" class="black"></td>
        <td class="white"></td>
        <td colspan="2" class="white"></td>
      </tr>
      <tr style="height: 85px">
        <td rowspan="3" class="yellow"></td>
        <td class="white"></td>
        <td colspan="2" rowspan="2" class="blue"></td>
      </tr>
      <tr style="height: 45px">
        <td colspan="2" rowspan="2" class="white"></td>
        <td class="black"></td>
      </tr>
      <tr style="height: 45px">
        <td colspan="3" class="white"></td>
      </tr>
    </table>
  </body>
  </html>
